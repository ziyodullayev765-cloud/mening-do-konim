services:
  - type: web
    name: lor-doctor-website
    runtime: node
    rootDir: lor-website
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lor-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: lor-db
    plan: free
